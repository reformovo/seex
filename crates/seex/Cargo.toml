[package]
name = "seex"
version = "0.1.0-beta.0"
edition = "2024"
description = "Unified Rust SDK facade for Seex."
license = "MIT"
repository = "https://github.com/reformovo/seex"
publish = false

[dependencies]
chrono = "0.4"
duckdb = { version = "~1.10504.0", features = ["bundled"] }
seex-model = { path = "../seex-model" }
thiserror = "2"
toml = "1.1.2"
uuid = { version = "1.0", features = ["v4"] }

[dev-dependencies]
seex-core = { path = "../seex-core" }
seex-storage = { path = "../seex-storage" }
tempfile = "3"

[lib]
name = "seex"
path = "src/lib.rs"
