[package]
name = "seex"
version = "0.1.0-beta.3"
edition = "2024"
description = "Unified Rust SDK facade for Seex."
license = "MIT"
repository = "https://github.com/reformovo/seex"

[dependencies]
chrono = "0.4"
duckdb = { version = "~1.10504.0", features = ["bundled"] }
thiserror = "2"
toml = "1.1.2"
uuid = { version = "1.0", features = ["v4"] }

[dev-dependencies]
tempfile = "3"

[lib]
name = "seex"
path = "src/lib.rs"
