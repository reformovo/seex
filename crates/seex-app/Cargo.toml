[package]
name = "seex-app"
version = "0.1.0-beta.3"
edition = "2024"
description = "Native desktop curve viewer for Seex."
license = "MIT"
repository = "https://github.com/reformovo/seex"
publish = false

[package.metadata.bundle]
name = "Seex"
identifier = "dev.seex.Seex"
icon = ["resources/Seex.icns"]
osx_minimum_system_version = "10.15.7"

[features]
default = ["desktop"]
desktop = ["dep:gpui"]
test-support = ["desktop", "gpui/test-support"]

[dependencies]
seex = { path = "../seex" }
seex-plot = { path = "../seex-plot" }
thiserror = "2"
toml_edit = "0.25.12"

[target.'cfg(target_os = "macos")'.dependencies]
gpui = { version = "=0.2.2", default-features = false, features = ["font-kit"], optional = true }

[dev-dependencies]
tempfile = "3"

[lib]
name = "seex_app"
path = "src/lib.rs"

[[bin]]
name = "seex-app"
path = "src/main.rs"
