[package]
name = "seex-storage"
version = "0.1.0-beta.0"
edition = "2024"
description = "Native project and Parquet storage for Seex."
license = "MIT"
repository = "https://github.com/reformovo/seex"

[dependencies]
chrono = "0.4"
duckdb = { version = "~1.10504.0", features = ["bundled"] }
seex-model = { path = "../seex-model" }
thiserror = "2"
toml = "1.1.2"
uuid = { version = "1.0", features = ["v4"] }

[lib]
name = "seex_storage"
path = "src/lib.rs"
