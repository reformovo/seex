[package]
name = "seex-core"
version = "0.1.0-beta.0"
edition = "2024"
description = "Application orchestration for Seex clients and runs."
license = "MIT"
repository = "https://github.com/reformovo/seex"
readme = "../../README.md"

[lib]
name = "seex_core"

[dependencies]
seex = { path = "../seex" }

[dev-dependencies]
duckdb = { version = "~1.10504.0", features = ["bundled"] }

[features]
default = ["native"]
native = []
