[package]
name = "seex-python"
version = "0.1.0-beta.5"
edition = "2024"
description = "Python extension bindings for Seex."
license = "MIT"
repository = "https://github.com/reformovo/seex"
readme = "../../README.md"
publish = false

[lib]
name = "seex"
crate-type = ["cdylib"]
doc = false

[dependencies]
arrow = "58.3.0"
seex = { path = "../seex" }
pyo3 = { version = "0.29", features = ["abi3-py311"] }

[dev-dependencies]
chrono = "0.4"
