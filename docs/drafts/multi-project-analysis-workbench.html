  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
    [aria-pressed=&quot;true&quot;],
    [aria-selected=&quot;true&quot;],
    .is-selected
  ) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

        showMorePinned.hidden = view.pinnedLimit &gt;= view.pinned.size;
        showMoreArchived.hidden = archivedLimit &gt;= archivedRuns.size;

      const projectMenuOptions = {
        normal: [[&#x27;pin&#x27;, &#x27;pin&#x27;, &#x27;Pin project&#x27;], [&#x27;archive&#x27;, &#x27;archive&#x27;, &#x27;Archive project&#x27;], [&#x27;remove&#x27;, &#x27;trash-2&#x27;, &#x27;Remove project&#x27;]],
        pinned: [[&#x27;unpin&#x27;, &#x27;pin-off&#x27;, &#x27;Unpin project&#x27;], [&#x27;archive&#x27;, &#x27;archive&#x27;, &#x27;Archive project&#x27;], [&#x27;remove&#x27;, &#x27;trash-2&#x27;, &#x27;Remove project&#x27;]],
        archived: [[&#x27;pin&#x27;, &#x27;pin&#x27;, &#x27;Pin project&#x27;], [&#x27;restore&#x27;, &#x27;archive-restore&#x27;, &#x27;Restore project&#x27;], [&#x27;remove&#x27;, &#x27;trash-2&#x27;, &#x27;Remove project&#x27;]],
      };

      const showProjectHoverCard = (entry) =&gt; {
        const name = entry.dataset.projectName;
        const placement = projectPlacements.get(name);
        const count = Number.parseInt(entry.dataset.runCount, 10);
        const status = placement === &#x27;normal&#x27;
          ? &#x27;&#x27;

        projectHoverCard.innerHTML = `&lt;div class=&quot;project-hover-row&quot;&gt;&lt;i data-lucide=&quot;folder&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;strong class=&quot;project-hover-title&quot;&gt;${name}&lt;/strong&gt;${status}&lt;/div&gt;&lt;div class=&quot;project-hover-row&quot;&gt;&lt;i data-lucide=&quot;circle-play&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;span&gt;${count} ${count === 1 ? &#x27;Run&#x27; : &#x27;Runs&#x27;}&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;project-hover-row project-hover-source&quot;&gt;&lt;i data-lucide=&quot;database&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;span&gt;local-training&lt;/span&gt;&lt;/div&gt;`;
        projectHoverCard.hidden = false;
        const sourceBounds = sources.getBoundingClientRect();
        const rowBounds = entry.querySelector(&#x27;[data-project-row]&#x27;).getBoundingClientRect();

        projectHoverCard.style.setProperty(&#x27;--project-hover-y&#x27;, `${Math.max(8, Math.min(maximumTop, rowBounds.top - sourceBounds.top))}px`);
        if (window.lucide) window.lucide.createIcons({ attrs: { width: 16, height: 16 } });
      };

      const hideProjectHoverCard = () =&gt; { projectHoverCard.hidden = true; };

      const moveProject = (entry, placement) =&gt; {
        const destination = placement === &#x27;pinned&#x27; ? pinnedProjects : placement === &#x27;archived&#x27; ? archivedProjects : projectList;
        entry.hidden = false;
        destination.append(entry);
      };

      const openProjectMenu = (entry) =&gt; {
        const name = entry.dataset.projectName;
        const placement = projectPlacements.get(name);
        const view = activeViewState();
        const projectRuns = name === &#x27;vision-transformer&#x27; ? projectRunsFor(view) : [];
        const visibleCount = projectRuns.filter((runName) =&gt; view.selected.has(runName)).length;
        const visibilityState = visibleCount === 0 ? &#x27;none&#x27; : visibleCount === projectRuns.length ? &#x27;all&#x27; : &#x27;mixed&#x27;;
        const visibilityOption = projectRuns.length === 0
          ? []
          : [[visibilityState === &#x27;all&#x27; ? &#x27;hide-project-runs&#x27; : &#x27;show-project-runs&#x27;, visibilityState === &#x27;all&#x27; ? &#x27;eye&#x27; : visibilityState === &#x27;none&#x27; ? &#x27;eye-closed&#x27; : &#x27;eye-off&#x27;, visibilityState === &#x27;all&#x27; ? &#x27;Hide all Runs&#x27; : &#x27;Show all Runs&#x27;]];
        projectMenuTarget = entry;
        hideProjectHoverCard();
        projectMenu.innerHTML = [...visibilityOption, ...projectMenuOptions[placement]].map(([action, icon, label]) =&gt; `&lt;button type=&quot;button&quot; class=&quot;btn btn-ghost&quot; role=&quot;menuitem&quot; data-project-action=&quot;${action}&quot;&gt;&lt;i data-lucide=&quot;${icon}&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;${label}&lt;/button&gt;`).join(&#x27;&#x27;);

        const trigger = entry.querySelector(&#x27;[data-project-menu-trigger]&#x27;);

        projectMenu.style.setProperty(&#x27;--project-menu-y&#x27;, `${Math.max(8, Math.min(maximumTop, triggerBounds.bottom - sourceBounds.top + 4))}px`);
        if (window.lucide) window.lucide.createIcons({ attrs: { width: 16, height: 16 } });

      const applyRunAction = (name, action) =&gt; {
        const view = activeViewState();
        if (action === &#x27;set-baseline&#x27;) {
          archivedRuns.delete(name);
          view.pinned.delete(name);
          view.baseline = name;
          view.selected.add(name);
        }
        if (action === &#x27;clear-baseline&#x27;) view.baseline = null;
        if (action === &#x27;pin&#x27;) {
          archivedRuns.delete(name);
          if (view.baseline === name) view.baseline = null;
          view.pinned.add(name);
          view.selected.add(name);

        if (action === &#x27;unpin&#x27;) view.pinned.delete(name);

          archivedRuns.add(name);
          viewStates.forEach((state) =&gt; {
            state.pinned.delete(name);
            if (state.baseline === name) state.baseline = null;
          });
        }
        if (action === &#x27;restore&#x27;) archivedRuns.delete(name);
        updateBaselineEvidence();
        renderRunOrganization();
      };

      const applyProjectAction = (action) =&gt; {
        if (!projectMenuTarget) return;
        const name = projectMenuTarget.dataset.projectName;
        const view = activeViewState();
        const projectRuns = name === &#x27;vision-transformer&#x27; ? projectRunsFor(view) : [];
        if (action === &#x27;show-project-runs&#x27;) projectRuns.forEach((runName) =&gt; view.selected.add(runName));
        if (action === &#x27;hide-project-runs&#x27;) projectRuns.forEach((runName) =&gt; view.selected.delete(runName));
        if (action === &#x27;pin&#x27;) projectPlacements.set(name, &#x27;pinned&#x27;);
        if (action === &#x27;unpin&#x27; || action === &#x27;restore&#x27;) projectPlacements.set(name, &#x27;normal&#x27;);
        if (action === &#x27;archive&#x27;) projectPlacements.set(name, &#x27;archived&#x27;);
        if (action === &#x27;remove&#x27;) projectMenuTarget.hidden = true;
        if (action === &#x27;pin&#x27; || action === &#x27;unpin&#x27; || action === &#x27;restore&#x27; || action === &#x27;archive&#x27;) {
          moveProject(projectMenuTarget, projectPlacements.get(name));
        }
        if (action === &#x27;show-project-runs&#x27; || action === &#x27;hide-project-runs&#x27;) renderRunOrganization();
        projectMenuTarget.querySelector(&#x27;[data-project-menu-trigger]&#x27;).setAttribute(&#x27;aria-expanded&#x27;, &#x27;false&#x27;);
        projectMenu.hidden = true;
        projectMenuTarget = null;
      };

      sources.addEventListener(&#x27;click&#x27;, (event) =&gt; {
        const runVisibility = event.target.closest(&#x27;[data-run-visibility]&#x27;);
        if (runVisibility) {
          const view = activeViewState();
          const name = runVisibility.closest(&#x27;[data-run-name]&#x27;).dataset.runName;
          if (view.selected.has(name)) view.selected.delete(name); else view.selected.add(name);
          renderRunOrganization();
          return;
        }
        const expansion = event.target.closest(&#x27;[data-project-expansion]&#x27;);
        if (expansion) {
          const entry = expansion.closest(&#x27;[data-project-entry]&#x27;);
          const children = entry.querySelector(&#x27;[data-project-children]&#x27;);
          const expanded = expansion.getAttribute(&#x27;aria-expanded&#x27;) === &#x27;true&#x27;;
          expansion.setAttribute(&#x27;aria-expanded&#x27;, String(!expanded));
          expansion.setAttribute(&#x27;aria-label&#x27;, `${expanded ? &#x27;Expand&#x27; : &#x27;Collapse&#x27;} ${entry.dataset.projectName} Runs`);
          children.hidden = expanded;
          setButtonIcon(expansion, expanded ? &#x27;folder&#x27; : &#x27;folder-open&#x27;);
          return;
        }
        const projectMenuButton = event.target.closest(&#x27;[data-project-menu-trigger]&#x27;);
        if (projectMenuButton) {
          const entry = projectMenuButton.closest(&#x27;[data-project-entry]&#x27;);
          if (projectMenu.hidden || projectMenuTarget !== entry) openProjectMenu(entry);
          else {
            projectMenu.hidden = true;
            projectMenuButton.setAttribute(&#x27;aria-expanded&#x27;, &#x27;false&#x27;);
            projectMenuTarget = null;

          return;
        }
        const runAction = event.target.closest(&#x27;[data-run-action]&#x27;);
        if (runAction) applyRunAction(runAction.closest(&#x27;[data-run-name]&#x27;).dataset.runName, runAction.dataset.runAction);
      });

      sources.addEventListener(&#x27;pointerover&#x27;, (event) =&gt; {
        const row = event.target.closest(&#x27;[data-project-row]&#x27;);
        if (!row || row.contains(event.relatedTarget)) return;
        showProjectHoverCard(row.closest(&#x27;[data-project-entry]&#x27;));
      });

      sources.addEventListener(&#x27;pointerout&#x27;, (event) =&gt; {
        const row = event.target.closest(&#x27;[data-project-row]&#x27;);
        if (!row || row.contains(event.relatedTarget)) return;
        hideProjectHoverCard();
      });

      sources.addEventListener(&#x27;focusin&#x27;, (event) =&gt; {
        const row = event.target.closest(&#x27;[data-project-row]&#x27;);
        if (row) showProjectHoverCard(row.closest(&#x27;[data-project-entry]&#x27;));

      sources.addEventListener(&#x27;focusout&#x27;, (event) =&gt; {
        const row = event.target.closest(&#x27;[data-project-row]&#x27;);
        if (row &amp;&amp; !row.contains(event.relatedTarget)) hideProjectHoverCard();
      });

      projectMenu.addEventListener(&#x27;click&#x27;, (event) =&gt; {
        const action = event.target.closest(&#x27;[data-project-action]&#x27;)?.dataset.projectAction;
        if (action) applyProjectAction(action);
      });

      showMoreRuns.addEventListener(&#x27;click&#x27;, () =&gt; { activeViewState().projectLimit += 5; renderRunOrganization(); });
      showMorePinned.addEventListener(&#x27;click&#x27;, () =&gt; { activeViewState().pinnedLimit += 5; renderRunOrganization(); });
      showMoreArchived.addEventListener(&#x27;click&#x27;, () =&gt; { archivedLimit += 5; renderRunOrganization(); });
      runFilter.addEventListener(&#x27;input&#x27;, renderRunOrganization);
      renderRunOrganization();

      addMetricButton.addEventListener(&#x27;click&#x27;, () =&gt; {
        const expanded = metricPopover.hidden;
        setExpanded(axisModeButton, axisPopover, false);
        setExpanded(addMetricButton, metricPopover, expanded);
        if (expanded) metricSearch.focus();
      });

      axisModeButton.addEventListener(&#x27;click&#x27;, () =&gt; {
        const expanded = axisPopover.hidden;
        setExpanded(addMetricButton, metricPopover, false);
        setExpanded(axisModeButton, axisPopover, expanded);
      });

      const updateMetricOptions = () =&gt; {
        const query = metricSearch.value.trim().toLowerCase();
        let visibleCount = 0;
        root.querySelectorAll(&#x27;[data-metric-option]&#x27;).forEach((option) =&gt; {
          const visible = option.dataset.metricOption.toLowerCase().includes(query);
          option.hidden = !visible;
          if (visible) visibleCount += 1;
        });
        metricEmpty.hidden = visibleCount !== 0;
      };

      metricSearch.addEventListener(&#x27;input&#x27;, updateMetricOptions);

      root.querySelectorAll(&#x27;[data-metric-option]&#x27;).forEach((option) =&gt; {
        option.addEventListener(&#x27;click&#x27;, () =&gt; {
          option.remove();
          updateMetricOptions();

      const viewTabs = () =&gt; [...root.querySelectorAll(&#x27;[data-view-tab]&#x27;)];

      const selectView = (viewTab) =&gt; {

          const nameButton = candidate.querySelector(&#x27;[data-view-name]&#x27;);
          nameButton.classList.toggle(&#x27;is-selected&#x27;, selected);
          nameButton.classList.toggle(&#x27;btn-ghost&#x27;, !selected);
          nameButton.setAttribute(&#x27;aria-selected&#x27;, String(selected));
        });
        updateBaselineEvidence();
        renderRunOrganization();
      };

      const updateViewCloseState = () =&gt; {
        const onlyOneView = viewTabs().length === 1;
        root.querySelectorAll(&#x27;[data-close-view]&#x27;).forEach((closeTarget) =&gt; {
          closeTarget.setAttribute(&#x27;aria-disabled&#x27;, String(onlyOneView));
          closeTarget.setAttribute(&#x27;data-tooltip&#x27;, onlyOneView ? &#x27;At least one view is required&#x27; : &#x27;Close view&#x27;);
        });
      };

      const removeView = (viewTab) =&gt; {
        const tabs = viewTabs();
        if (tabs.length === 1 || !viewTab) return;
        const wasSelected = viewTab.querySelector(&#x27;[data-view-name]&#x27;).getAttribute(&#x27;aria-selected&#x27;) === &#x27;true&#x27;;
        const remaining = tabs.filter((candidate) =&gt; candidate !== viewTab);
        viewStates.delete(viewTab.dataset.viewId);
        viewTab.remove();
        if (wasSelected) selectView(remaining[0]);
        updateViewCloseState();
        viewMenu.hidden = true;
      };

      workspaceToolbar.addEventListener(&#x27;click&#x27;, (event) =&gt; {
        const closeButton = event.target.closest(&#x27;[data-close-view]&#x27;);
        if (closeButton) {
          removeView(closeButton.closest(&#x27;[data-view-tab]&#x27;));
          return;
        }
        const nameButton = event.target.closest(&#x27;[data-view-name]&#x27;);
        if (nameButton) selectView(nameButton.closest(&#x27;[data-view-tab]&#x27;));
      });

      workspaceToolbar.addEventListener(&#x27;contextmenu&#x27;, (event) =&gt; {
        const nameButton = event.target.closest(&#x27;[data-view-name]&#x27;);
        if (!nameButton) return;
        event.preventDefault();
        contextViewTab = nameButton.closest(&#x27;[data-view-tab]&#x27;);
        selectView(contextViewTab);
        const bounds = workspaceToolbar.getBoundingClientRect();
        const x = Math.max(8, Math.min(bounds.width - 158, event.clientX - bounds.left));
        const y = event.clientY - bounds.top + 4;
        viewMenu.style.setProperty(&#x27;--view-menu-x&#x27;, `${x}px`);
        viewMenu.style.setProperty(&#x27;--view-menu-y&#x27;, `${y}px`);
        viewMenu.hidden = false;
      });

      root.querySelector(&#x27;[data-rename-view]&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; {
        if (!contextViewTab) return;
        const nameButton = contextViewTab.querySelector(&#x27;[data-view-name]&#x27;);
        const label = nameButton.querySelector(&#x27;[data-view-label]&#x27;);
        const nextName = window.prompt(&#x27;Rename view&#x27;, label.textContent.trim());
        if (nextName &amp;&amp; nextName.trim()) {

      root.querySelector(&#x27;[data-delete-view]&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; removeView(contextViewTab));

      newViewButton.addEventListener(&#x27;click&#x27;, () =&gt; {
        const viewNumber = viewTabs().length + 1;
        const viewTab = document.createElement(&#x27;span&#x27;);
        viewTab.className = &#x27;view-tab&#x27;;
        viewTab.setAttribute(&#x27;data-view-tab&#x27;, &#x27;&#x27;);
        viewTab.dataset.viewId = `view-${viewNumber}`;
        viewStates.set(viewTab.dataset.viewId, { baseline: null, pinned: new Set(), selected: new Set(), projectLimit: 5, pinnedLimit: 5 });
        viewTab.innerHTML = `&lt;button type=&quot;button&quot; class=&quot;btn btn-ghost&quot; data-view-name role=&quot;tab&quot; aria-selected=&quot;false&quot; aria-label=&quot;View ${viewNumber}&quot;&gt;&lt;span data-view-label&gt;View ${viewNumber}&lt;/span&gt;&lt;span data-close-view data-tooltip=&quot;Close view&quot;&gt;&lt;i data-lucide=&quot;x&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;/span&gt;&lt;/button&gt;`;
        viewTabsContainer.append(viewTab);
        selectView(viewTab);
        updateViewCloseState();
        viewTab.scrollIntoView({ behavior: &#x27;smooth&#x27;, inline: &#x27;nearest&#x27;, block: &#x27;nearest&#x27; });
        if (window.lucide) window.lucide.createIcons({ attrs: { width: 16, height: 16 } });
      });

      root.addEventListener(&#x27;pointerdown&#x27;, (event) =&gt; {
        if (!viewMenu.contains(event.target) &amp;&amp; !event.target.closest(&#x27;[data-view-name]&#x27;)) viewMenu.hidden = true;
        if (!projectMenu.contains(event.target) &amp;&amp; !event.target.closest(&#x27;[data-project-menu-trigger]&#x27;)) {
          projectMenu.hidden = true;
          if (projectMenuTarget) projectMenuTarget.querySelector(&#x27;[data-project-menu-trigger]&#x27;).setAttribute(&#x27;aria-expanded&#x27;, &#x27;false&#x27;);
          projectMenuTarget = null;
        }
        if (!axisPopover.contains(event.target) &amp;&amp; !event.target.closest(&#x27;#axis-mode-button&#x27;)) {
          setExpanded(axisModeButton, axisPopover, false);
        }
        if (!metricPopover.contains(event.target) &amp;&amp; !event.target.closest(&#x27;#add-metric-button&#x27;)) {
          setExpanded(addMetricButton, metricPopover, false);
        }
      });

      updateViewCloseState();

      const setSidebarHidden = (hidden) =&gt; shell.classList.toggle(&#x27;sidebar-hidden&#x27;, hidden);

      sidebarCollapse.addEventListener(&#x27;click&#x27;, () =&gt; setSidebarHidden(true));
      sidebarToggle.addEventListener(&#x27;click&#x27;, () =&gt; setSidebarHidden(false));

      const setInspectorVisible = (visible) =&gt; {
        inspector.hidden = !visible;
        detailsToggle.setAttribute(&#x27;aria-pressed&#x27;, String(visible));
        detailsToggle.setAttribute(&#x27;data-tooltip&#x27;, visible ? &#x27;Hide bottom inspector&#x27; : &#x27;Show bottom inspector&#x27;);
        detailsToggle.setAttribute(&#x27;aria-label&#x27;, visible ? &#x27;Hide bottom inspector&#x27; : &#x27;Show bottom inspector&#x27;);
        setButtonIcon(detailsToggle, visible ? &#x27;panel-bottom-close&#x27; : &#x27;panel-bottom-open&#x27;);
      };

      detailsToggle.addEventListener(&#x27;click&#x27;, () =&gt; setInspectorVisible(inspector.hidden));
      closeInspector.addEventListener(&#x27;click&#x27;, () =&gt; setInspectorVisible(false));

      const elapsedTimeAt = (ratio) =&gt; {
        const totalMinutes = Math.round(ratio * 240);
        const hours = Math.floor(totalMinutes / 60);
        const minutes = totalMinutes % 60;
        return `${String(hours).padStart(2, &#x27;0&#x27;)}:${String(minutes).padStart(2, &#x27;0&#x27;)}`;
      };

      const updateAxis = () =&gt; {
        const elapsed = root.querySelector(&#x27;[data-axis-mode].is-selected&#x27;).dataset.axisMode === &#x27;time&#x27;;
        const labels = elapsed
          ? [&#x27;00:00&#x27;, &#x27;01:00&#x27;, &#x27;02:00&#x27;, &#x27;03:00&#x27;, &#x27;04:00&#x27;]
          : [&#x27;0&#x27;, &#x27;200k&#x27;, &#x27;400k&#x27;, &#x27;600k&#x27;, &#x27;800k&#x27;];
        axisTicks.querySelectorAll(&#x27;span&#x27;).forEach((tick, index) =&gt; {
          tick.textContent = labels[index];
        });
        const formatCoordinate = (ratio) =&gt; elapsed ? elapsedTimeAt(ratio) : `${Math.round(ratio * 800)}k`;
        cursorLabel.textContent = formatCoordinate(hoverCursorRatio);
        selectedStep.textContent = formatCoordinate(lockedCursorRatio ?? hoverCursorRatio);
      };

      axisModeButtons.forEach((button) =&gt; {
        button.addEventListener(&#x27;click&#x27;, () =&gt; {
          const mode = button.dataset.axisMode;
          axisModeButtons.forEach((candidate) =&gt; {
            const selected = candidate === button;
            candidate.classList.toggle(&#x27;is-selected&#x27;, selected);
            candidate.classList.toggle(&#x27;btn-ghost&#x27;, !selected);
            candidate.setAttribute(&#x27;aria-pressed&#x27;, String(selected));
            candidate.querySelector(&#x27;[data-axis-status]&#x27;).textContent = selected ? &#x27;Selected&#x27; : &#x27;&#x27;;
          });
          setButtonIcon(axisModeButton, mode === &#x27;time&#x27; ? &#x27;clock&#x27; : &#x27;arrow-up&#x27;);
          const label = mode === &#x27;time&#x27; ? &#x27;Axis: Elapsed time&#x27; : &#x27;Axis: Step&#x27;;
          axisModeButton.setAttribute(&#x27;aria-label&#x27;, label);
          axisModeButton.setAttribute(&#x27;data-tooltip&#x27;, label);
          setExpanded(axisModeButton, axisPopover, false);
          updateAxis();
        });
      });

      const rulerDimensions = () =&gt; {
        const viewportWidth = rulerScroll.clientWidth;
        const labelWidth = Number.parseFloat(getComputedStyle(root).getPropertyValue(&#x27;--track-label-width&#x27;)) || 0;
        const plotViewportWidth = Math.max(1, viewportWidth - labelWidth);
        return { labelWidth, plotViewportWidth };
