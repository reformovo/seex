# Initially generated by maturin v1.13.3 and maintained for Seex CI and releases.
# Do not replace its release dependency graph with raw generate-ci output.
name: CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    name: Rust checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Run Rust tests (release)
        run: cargo test --release --workspace --all-features

  python:
    name: Python checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install Seex and test dependencies
        run: uv sync --group testing-extra --group linting
      - name: Check Python formatting
        run: uv run --group linting ruff format --check python scripts tests
      - name: Lint Python
        run: uv run --group linting ruff check python scripts tests
      - name: Type-check Python
        run: uv run pyright
      - name: Run Python tests
        run: uv run pytest

  linux:
    if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        # DuckDB 2.0 publishes the ducklake extension only for amd64 and arm64,
        # so other architectures cannot install it at runtime.
        platform:
          - runner: ubuntu-22.04
            target: x86_64
          - runner: ubuntu-22.04
            target: aarch64
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist --find-interpreter
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          manylinux: manylinux_2_28
      - name: Upload wheels
        uses: actions/upload-artifact@v6
        with:
          name: wheels-linux-${{ matrix.platform.target }}
          path: dist

  musllinux:
    if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        # DuckDB 2.0 publishes the ducklake extension only for amd64 and arm64
        # musl, so other architectures cannot install it at runtime.
        platform:
          - runner: ubuntu-22.04
            target: x86_64
          - runner: ubuntu-22.04
            target: aarch64
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist --find-interpreter
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          manylinux: musllinux_1_2
      - name: Upload wheels
        uses: actions/upload-artifact@v6
        with:
          name: wheels-musllinux-${{ matrix.platform.target }}
          path: dist

  windows:
    if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        # 32-bit Windows has no DuckDB 2.0 ducklake extension.
        platform:
          - runner: windows-latest
            target: x64
            python_arch: x64
          - runner: windows-11-arm
            target: aarch64
            python_arch: arm64
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          architecture: ${{ matrix.platform.python_arch }}
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist --find-interpreter
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
      - name: Upload wheels
        uses: actions/upload-artifact@v6
        with:
          name: wheels-windows-${{ matrix.platform.target }}
          path: dist

  macos:
    if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.platform.runner }}
    env:
      # DuckDB 2.0 uses aligned new/delete, which needs macOS 10.13 or newer.
      MACOSX_DEPLOYMENT_TARGET: "10.13"
    strategy:
      matrix:
        platform:
          - runner: macos-15-intel
            target: x86_64
          - runner: macos-latest
            target: aarch64
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist --find-interpreter
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
      - name: Upload wheels
        uses: actions/upload-artifact@v6
        with:
          name: wheels-macos-${{ matrix.platform.target }}
          path: dist

  viewer-macos-aarch64:
    name: Viewer (macOS aarch64)
    if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Verify Xcode Metal Toolchain
        run: |
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version
          xcrun --find metal
          xcrun --find metallib
          xcrun metal --version
      - name: Install cargo-bundle
        run: cargo install cargo-bundle --version 0.11.0 --locked
      - name: Build Viewer app bundle
        working-directory: crates/seex-app
        run: cargo bundle --release --format osx
      - name: Ad-hoc sign and verify Viewer
        run: |
          codesign --force --deep --sign - target/release/bundle/osx/Seex.app
          codesign --verify --deep --strict --verbose=4 target/release/bundle/osx/Seex.app
          test "$(plutil -extract CFBundleIconFile raw target/release/bundle/osx/Seex.app/Contents/Info.plist)" = "Seex.icns"
          test -s target/release/bundle/osx/Seex.app/Contents/Resources/Seex.icns
      - name: Prepare Viewer artifact and checksum
        run: |
          mkdir -p dist
          ditto -c -k --keepParent target/release/bundle/osx/Seex.app dist/Seex-macos-aarch64.zip
          cd dist
          shasum -a 256 Seex-macos-aarch64.zip > Seex-macos-aarch64.zip.sha256
      - name: Upload Viewer artifact
        uses: actions/upload-artifact@v6
        with:
          name: viewer-macos-aarch64
          path: |
            dist/Seex-macos-aarch64.zip
            dist/Seex-macos-aarch64.zip.sha256

  sdist:
    if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - name: Install and smoke test sdist
        run: |
          python -m venv .sdist-venv
          .sdist-venv/bin/python -m pip install dist/*.tar.gz
          .sdist-venv/bin/python scripts/wheel_smoke.py
      - name: Upload sdist
        uses: actions/upload-artifact@v6
        with:
          name: wheels-sdist
          path: dist

  wheel-smoke:
    name: Wheel smoke (${{ matrix.platform.name }})
    if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    needs: [linux, windows, macos]
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: linux-x86_64
            runner: ubuntu-22.04
            artifact: wheels-linux-x86_64
          - name: macos-x86_64
            runner: macos-15-intel
            artifact: wheels-macos-x86_64
          - name: macos-aarch64
            runner: macos-latest
            artifact: wheels-macos-aarch64
          - name: windows-x64
            runner: windows-latest
            artifact: wheels-windows-x64
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Download built wheel
        uses: actions/download-artifact@v7
        with:
          name: ${{ matrix.platform.artifact }}
          path: dist
      - name: Install built wheel
        run: >-
          python -c "import glob, subprocess, sys;
          wheels = glob.glob('dist/*.whl');
          assert len(wheels) == 1, wheels;
          subprocess.check_call([sys.executable, '-m', 'pip', 'install',
          '--force-reinstall', *wheels])"
      - name: Run installed-package smoke test
        run: python scripts/wheel_smoke.py

  check:
    name: Required checks
    if: always()
    needs: [rust, python]
    runs-on: ubuntu-latest
    steps:
      - name: Require successful quality jobs
        run: |
          test "${{ needs.rust.result }}" = "success"
          test "${{ needs.python.result }}" = "success"

  release-guard:
    name: Release guard
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check, linux, musllinux, windows, macos, sdist, wheel-smoke, viewer-macos-aarch64]
    steps:
      - uses: actions/checkout@v6
      - name: Download Python artifacts only
        uses: actions/download-artifact@v7
        with:
          pattern: wheels-*
          path: release/python
          merge-multiple: true
      - name: Download Viewer artifacts only
        uses: actions/download-artifact@v7
        with:
          name: viewer-macos-aarch64
          path: release/viewer
      - name: Validate release identity and artifact isolation
        run: >-
          python scripts/release_guard.py
          --tag "$GITHUB_REF_NAME"
          --python-artifacts release/python
          --viewer-artifacts release/viewer
      - name: Verify Viewer checksum
        working-directory: release/viewer
        run: shasum -a 256 -c Seex-macos-aarch64.zip.sha256

  publish-crates:
    name: Publish crates.io
    runs-on: ubuntu-latest
    needs: [release-guard]
    environment: release
    steps:
      - uses: actions/checkout@v6
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Publish public Rust SDK
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p seex --locked

  publish-pypi:
    name: Publish PyPI
    runs-on: ubuntu-latest
    needs: [publish-crates]
    environment: release
    permissions:
      id-token: write
      attestations: write
      contents: read
    steps:
      - name: Download Python artifacts only
        uses: actions/download-artifact@v7
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - name: Attest Python artifacts
        uses: actions/attest@v4
        with:
          subject-path: "dist/*"
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Publish to PyPI
        run: uv publish --trusted-publishing always 'dist/*'

  github-release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [publish-pypi]
    permissions:
      id-token: write
      attestations: write
      contents: write
    steps:
      - name: Download Viewer artifacts only
        uses: actions/download-artifact@v7
        with:
          name: viewer-macos-aarch64
          path: release/viewer
      - name: Attest Viewer artifacts
        uses: actions/attest@v4
        with:
          subject-path: "release/viewer/*"
      - name: Create prerelease
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          generate_release_notes: true
          files: "release/viewer/*"
